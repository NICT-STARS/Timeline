<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Timeline</title>
    <link   type="text/css" href="css/index.css" rel="stylesheet">
    <link   type="text/css" href="css/k2go-timeline.css" rel="stylesheet">
    <script type="text/javascript" src="js/k2go-timeline.js"></script>
    <script type="text/javascript" src="js/k2go-timeline-env.js"></script>
    <script type="text/javascript" src="js/index.js"></script>
  </head>
  <body>
    <k2go-timelineheader data-header-position="top"></k2go-timelineheader>
    <k2go-functionbar></k2go-functionbar>
    <div id="main">
      <div id="content">
          <table class="app_table">
            <tbody>
              <tr>
                <td id="min_time"    >min     time<br /><span></span></td>
                <td></td>
                <td id="max_time"    >max     time<br /><span></span></td>
              </tr>
              <tr>
                <td id="start_time"  >start   time<br /><span></span></td>
                <td id="current_time">current time<br /><span></span></td>
                <td id="end_time"    >end     time<br /><span></span></td>
              </tr>
              <tr>
                <td id="range_start_time">range start time<br /><span></span></td>
                <td></td>
                <td id="range_end_time">range end time<br /><span></span></td>
              </tr>
              <tr>
                <td colspan="3">
                  event info<br/>
                  <div id="event_info"></div>
                </td>
              </tr>
            </tbody>
        </table>
      </div>
    </div>
    <k2go-timeline data-pick-line-distance="body" data-pick-line-position="bottom"></k2go-timeline>
   <div id="lockWindow"></div>
  </body>
</html>
